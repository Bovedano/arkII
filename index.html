    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        /* height:100% keeps body from exceeding the visible viewport on browsers
           without dvh support; the 100dvh rule below overrides it where available. */
        height: 100%;
      }
      #root {
        display: flex;
        width: 100vw;
        height: 100vh;
        /* dvh tracks the browser's real visible height (address bar shown/hidden),
           unlike vh which is fixed to the layout viewport and gets cut off or
           leaves dead space on mobile browsers. */
        height: 100dvh;
      }
      #app {
        /* Phaser's Scale.CENTER_BOTH already centers the canvas itself via
           marginLeft/marginTop, assuming it sits at the top-left of a plain
           block parent. Also centering #app's content with flexbox would
           center the canvas's margin box, doubling the offset. */
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      /* Real flex sibling of #app, not a floating overlay — reserving this column's width
         forces #app (and the Phaser canvas inside it) to shrink and share the screen instead
         of the sidebar floating on top and guessing at the canvas's rendered bounds. */
      #editor-sidebar {
        display: none;
        height: 100%;
        box-sizing: border-box;
      }
      #editor-sidebar.active {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        flex: 0 0 230px;
        width: 230px;
        overflow-y: auto;
        background: #20202c;
        border-left: 1px solid #444;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app"></div>
      <div id="editor-sidebar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
